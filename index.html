<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Fondos de la Nación: el juego</title>
<style>
@font-face{font-family:'Fredoka One';src:url('assets/FredokaOne-Regular.ttf') format('truetype');font-display:swap}
:root{--bg:#111a3b;--panel:#1d2c5b;--ink:#f8f1cf;--dim:#a7b8d8;--cy:#61e5dc;--ye:#f5d15b;--mg:#e96ba6;--gr:#a7df67;--rd:#eb6e65;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka One','Trebuchet MS',sans-serif;font-size:22px;line-height:1.25;
background-image:linear-gradient(rgba(97,229,220,.065) 1px,transparent 1px),linear-gradient(90deg,rgba(97,229,220,.065) 1px,transparent 1px),linear-gradient(180deg,#18264d 0%,#111a3b 52%,#111a3b 100%);background-size:32px 32px,32px 32px,100% 100%;background-attachment:fixed}

main{max-width:760px;margin:0 auto;padding:16px}
.hero{display:flex;align-items:center;gap:18px;margin:14px 0 22px}
.ava{font-size:64px;width:112px;height:112px;display:grid;place-items:center;background:var(--panel);border:5px solid var(--c);box-shadow:6px 6px 0 rgba(0,0,0,.45);flex:none}

.track{height:22px;background:var(--bg);border:3px solid var(--dim);display:flex;gap:3px;padding:2px}

.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b38900}

.deckbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.left{color:var(--ye)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:18px}
.slot{aspect-ratio:3/4;max-height:180px;background:repeating-linear-gradient(45deg,#2b2470 0 8px,#241c5c 8px 16px);border:4px solid var(--dim);color:var(--dim);display:grid;place-items:center;text-align:center;padding:8px;font:inherit;cursor:default}
.slot.on{background:var(--panel);border-color:var(--c);color:var(--ink);cursor:pointer}
.slot .em{font-size:34px;display:block}.slot b{font-family:'Fredoka One','Trebuchet MS',sans-serif;font-weight:400;font-size:8px;line-height:1.5;color:var(--c)}
.slot.q{font-family:'Fredoka One','Trebuchet MS',sans-serif;font-size:26px}
.hud{background:var(--bg);border:4px solid var(--ye);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.pts{text-align:right;font-family:'Fredoka One','Trebuchet MS',sans-serif;font-size:12px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,7,32,.92);display:none;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
.ov.show{display:flex}
.big{position:relative;width:100%;max-width:560px;background:var(--panel);border:6px solid var(--c);box-shadow:10px 10px 0 rgba(0,0,0,.5);padding:28px 22px 24px;text-align:center;animation:fl .5s steps(5)}

.action-hand{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.action-card{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:10px;min-width:0;min-height:300px;padding:12px;background:linear-gradient(145deg,#34277c,#1d174d);color:var(--ink);border:5px ridge var(--ye);box-shadow:5px 6px 0 rgba(0,0,0,.45);text-align:left;cursor:pointer;font:inherit;transition:transform .15s,filter .15s}
.action-card:after{content:'';position:absolute;inset:5px;border:1px solid rgba(255,255,255,.18);pointer-events:none}
.action-card.ready:hover{transform:translateY(-5px) rotate(-1deg)}.action-card.unavailable{filter:grayscale(1);opacity:.58;cursor:not-allowed}
.action-card .card-icon{font-size:38px;text-align:center;line-height:1.2}.action-card .card-title{font:9px/1.6 'Fredoka One','Trebuchet MS',sans-serif;color:var(--ye);text-align:center}.action-card .card-description{font-size:18px;line-height:1.15}.action-card .eff{margin-top:auto;gap:5px}.action-card .eff span{font-size:14px;padding:2px 4px;border-width:2px;text-align:center}.action-card .card-cost{font-size:16px;color:var(--cy);text-align:center}.action-card .card-state{font:8px/1.5 'Fredoka One','Trebuchet MS',sans-serif;text-align:center;color:var(--gr)}
.action-card.back{width:min(190px,100%);min-height:260px;aspect-ratio:3/4;align-items:center;justify-content:center;text-align:center;background:repeating-linear-gradient(45deg,#2b2470 0 9px,#241c5c 9px 18px);color:var(--ye);font:48px 'Fredoka One','Trebuchet MS',sans-serif;cursor:default}
.modal-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px}.modal-actions .btn{font-size:10px}.btn.cancel{background:var(--dim);box-shadow:0 5px 0 #6b64a0}
.syncbox{margin:0 0 16px;padding:10px 12px;border:3px solid var(--ye);background:var(--panel);font-size:20px}
.syncbox small{display:block;color:var(--dim);font-size:18px;margin-top:4px}
.log{margin-top:18px;padding:12px;background:var(--bg);border:3px solid var(--dim)}.log h2{margin:0 0 8px}.log ul{margin:0;padding-left:24px}.log li{padding:4px 0}
.event-log{margin:12px 0;padding:12px;border:3px solid var(--event-color,var(--dim));background:var(--panel)}.event-log h3{font-size:10px;color:var(--event-color,var(--cy));margin:0 0 8px}.event-log p{margin:0 0 8px}.event-log .eff{justify-content:flex-start}
.round-panel{margin:16px 0;padding:14px;background:var(--panel);border:4px solid var(--ye);box-shadow:5px 5px 0 rgba(0,0,0,.4)}.round-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.round-current{font-family:'Fredoka One','Trebuchet MS',sans-serif;color:var(--ye);font-size:13px}.round-left{color:var(--cy);font-size:22px}.round-track{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:10px}.round-track i{height:14px;background:#2b2470;border:2px solid var(--dim)}.round-track i.done{background:var(--gr);border-color:var(--gr)}
.capital-box{margin-top:16px;padding:14px;background:var(--bg);border:4px solid var(--gr);box-shadow:5px 5px 0 rgba(0,0,0,.35)}.capital-box span{display:block;color:var(--dim);font-size:20px}.capital-box b{display:block;color:var(--gr);font-family:'Fredoka One','Trebuchet MS',sans-serif;font-size:clamp(14px,4vw,20px);margin-top:8px}
.game-hud-spacer{height:112px}
.game-hud{position:fixed;top:max(8px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));z-index:6;display:flex;align-items:stretch;gap:0;width:max-content;max-width:calc(100vw - 24px);margin:0;background:#101936;border:4px solid var(--ye);box-shadow:5px 5px 0 #080e22;font-family:'Fredoka One','Trebuchet MS',sans-serif}
.game-hud-round,.game-hud-money{display:flex;align-items:center;gap:10px;padding:9px 12px}.game-hud-round{position:relative;justify-content:center;min-width:150px;min-height:112px;padding-top:17px;border-right:3px solid #52658d}.game-hud-round:before,.game-hud-round:after{content:'';position:absolute;top:0;width:9px;height:34px;background:repeating-linear-gradient(0deg,#211711 0 5px,#765139 5px 9px);border:2px solid #17100d;box-shadow:2px 2px 0 rgba(0,0,0,.5);z-index:0}.game-hud-round:before{left:29%}.game-hud-round:after{right:29%}
.round-sign{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:126px;min-height:91px;padding:8px 10px 6px;color:#17100d;border:5px solid #21130f;clip-path:polygon(7% 0,93% 0,93% 5%,100% 5%,100% 95%,93% 95%,93% 100%,7% 100%,7% 95%,0 95%,0 5%,7% 5%);background-color:#c88e60;background-image:repeating-linear-gradient(0deg,transparent 0 10px,rgba(112,61,39,.12) 10px 13px,transparent 13px 19px),linear-gradient(90deg,rgba(111,61,43,.2),transparent 17% 83%,rgba(111,61,43,.2));filter:drop-shadow(4px 5px 0 #080a12);image-rendering:pixelated}
.round-sign-name{font-size:9px;letter-spacing:1px;color:#e62222;text-shadow:2px 2px 0 #160907,-1px -1px 0 #160907}.round-sign-number{font-size:34px;line-height:1.05;color:#fff;text-shadow:3px 3px 0 #17100d,-2px 2px 0 #17100d,2px -2px 0 #17100d,-2px -2px 0 #17100d}.round-sign-total{font-size:7px;color:#40271a;text-shadow:1px 1px 0 rgba(255,224,180,.7)}
.game-hud-money{min-width:158px}.game-hud-money>div{display:flex;flex-direction:column;gap:6px}.game-hud-label{font-size:8px;color:var(--dim)}.game-hud-money b{font-size:11px;line-height:1.5;color:var(--ye)}.game-hud-money img{width:30px;height:30px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(2px 2px 0 #070d1b)}
nav{background:#101936;border-bottom-color:var(--ye);box-shadow:0 4px 0 rgba(5,10,25,.8)}
.sheet,.log,.round-panel,.event-log{box-shadow:5px 5px 0 #080e22}
@media(max-width:520px){.game-hud-spacer{height:120px}.game-hud{top:max(8px,env(safe-area-inset-top,0px))}.game-hud-round{min-width:132px;min-height:100px;padding:12px 6px 7px}.round-sign{width:112px;min-height:82px}.round-sign-number{font-size:29px}.game-hud-money{min-width:138px;gap:7px;padding:8px}.game-hud-money b{font-size:9px}.game-hud-money img{width:26px;height:26px}}
.round-timer-hud{position:fixed;top:max(10px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:30;display:flex;align-items:center;gap:9px;min-height:0;padding:0;background:transparent;color:#fff;border:0;border-radius:0;box-shadow:none;font-family:'Fredoka One','Trebuchet MS',sans-serif;font-size:clamp(20px,3.8vw,34px);line-height:1;white-space:nowrap}

.round-expired-overlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.78);pointer-events:none}
.round-expired-overlay.show{display:flex}
.round-expired-message{padding:18px 24px;border:6px solid #111;border-radius:25px;background:#fff;color:#f5d15b;text-align:center;font:clamp(24px,6vw,48px)/1.15 'Fredoka One','Trebuchet MS',sans-serif;-webkit-text-stroke:7px #080808;paint-order:stroke fill;text-shadow:none}

@media(max-width:620px){.action-hand{grid-template-columns:repeat(2,minmax(0,1fr))}.action-card{min-height:280px}}
@media(max-width:520px){.stat{grid-template-columns:96px 1fr 34px}.row{grid-template-columns:1fr 56px}.row input{grid-column:1/-1;grid-row:2}.ava{width:84px;height:84px;font-size:46px}}
/* Estética ilustrada para las provincias; la votación conserva su estructura. */
