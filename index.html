.sheet,.log,.round-panel,.event-log{box-shadow:5px 5px 0 #080e22}
@media(max-width:520px){.game-hud{top:calc(54px + env(safe-area-inset-top,0px))}.game-hud-round{min-width:132px;min-height:100px;padding:12px 6px 7px}.round-sign{width:112px;min-height:82px}.round-sign-number{font-size:29px}.game-hud-money{min-width:138px;gap:7px;padding:8px}.game-hud-money b{font-size:9px}.game-hud-money img{width:26px;height:26px}}

</style>

  if(!available.length)return;
  const i=currentRound,chg=[];
  const apply=state=>{const next=migrateState(state||{stats:Object.fromEntries(P.map((p,i)=>[p.id,{...BASE[i]}])),drawn:[],history:[],round:0});if(next.drawn?.includes(i))return state;const round=Math.min(next.round??(next.drawn||[]).length,10);if(round>0&&!next.confirmedRounds?.[round])return undefined;const history=next.history||[],capitals={...BASE_CAPITALS,...next.capitals},capitalHistory=[...(next.capitalHistory||[])];Object.entries(EV[i].fx).forEach(([id,m])=>{const p=P.find(x=>x.id===id),changes=[];Object.entries(m).forEach(([k,d])=>{if(k==='Necesidad')return;const s=next.stats?.[id]||{...BASE[P.indexOf(p)]};const before=s[k]??0;let after,actual;if(k==='Economía'){const oldCapital=capitals[id]??BASE_CAPITALS[id];capitals[id]=Math.max(0,oldCapital+d*ECONOMY_POINT_VALUE);after=Math.floor(capitals[id]/ECONOMY_POINT_VALUE);actual=after-before;if(capitals[id]!==oldCapital)capitalHistory.push({province:id,round:round+1,amount:capitals[id]-oldCapital,at:Date.now(),kind:'noticia',event:EV[i].t})}else{after=Math.max(0,before+d);actual=after-before}s[k]=after;(next.stats??={})[id]=s;if(actual){chg.push(`<span class="${actual>0?'up':'dn'}">${p.n}: ${k} ${actual>0?'+':''}${actual}</span>`);changes.push({stat:k,delta:actual,before,after})}});recordNeedChange(id,next.stats[id],changes,chg);if(changes.length)history.push({province:id,changes,event:EV[i].t,card:i,at:Date.now()})});const nextDrawn=[...(next.drawn||[]),i],nextRound=nextDrawn.length,actionHands={...(next.actionHands||{})};if(nextRound>0&&!actionHands[nextRound])actionHands[nextRound]=dealActionHands();return {...next,actionHands,capitals,capitalHistory,drawn:nextDrawn,round:nextRound,history}};
  if(sync?.ready&&sync.update){sync.update(apply).then(state=>{if(!state?.drawn?.includes(i)){sync.state=state;sync.status='Confirmá el reparto de esta ronda antes de avanzar.';route();return}sync.state=state;drawn=state.drawn||[];P.forEach(p=>p.s={...(state.stats?.[p.id]||BASE[P.indexOf(p)])});P.forEach(p=>vals[p.id]=0);voteHTML='';saveLocalState();chgs[i]=chg.join('');route();openRoundIntro(state.round,i)}).catch(error=>{sync.status='No se pudo guardar: '+error.message;route()});return}
  const state=apply({stats:Object.fromEntries(P.map(p=>[p.id,{...p.s}])),drawn:drawn.filter(n=>n!==i),history:window.fondosSync.state?.history||[]});drawn=state.drawn;P.forEach(p=>p.s={...state.stats[p.id]});P.forEach(p=>vals[p.id]=0);voteHTML='';window.fondosSync.state={...(window.fondosSync.state||{}),...state};saveLocalState();chgs[i]=chg.join('');route();openRoundIntro(state.round,i);
}
$('#page').addEventListener('click',e=>{
  if(e.target.closest('#next-round'))draw();
  else if(e.target.closest('[data-action]')){
    const button=e.target.closest('[data-action]');openActionConfirm(button.dataset.province,button.dataset.action);
  }
  else if(e.target.closest('#finish')){
    const sync=window.fondosSync;
    if(sync?.ready&&sync.update){sync.update(state=>({...state,ended:true})).then(state=>{sync.state=state;drawn=state.drawn||[];saveLocalState();route()}).catch(error=>{sync.status='No se pudo terminar la partida: '+error.message;route()})}
    else{window.fondosSync.state={...(window.fondosSync.state||{}),ended:true};saveLocalState();route()}
  }
  else if(e.target.closest('#shuffle')){
    const sync=window.fondosSync;
    if(sync?.ready&&sync.update){sync.update(()=>({capitalVersion:CAPITAL_VERSION,stats:Object.fromEntries(P.map((p,i)=>[p.id,{...BASE[i]}])),capitals:{...BASE_CAPITALS},capitalHistory:[],investmentHistory:[],investmentUsed:{},actionUses:{},actionHistory:[],actionHands:{},drawn:[],round:0,ended:false,history:[],allocations:{},confirmedRounds:{}})).then(state=>{sync.state=state;drawn=[];P.forEach((p,i)=>p.s={...BASE[i]});P.forEach(p=>vals[p.id]=0);voteHTML='';saveLocalState();newDeck();route()}).catch(error=>{sync.status='No se pudo iniciar una nueva partida: '+error.message;route()})}
    else{newDeck();P.forEach(p=>vals[p.id]=0);voteHTML='';window.fondosSync.state={...(window.fondosSync.state||{}),capitalVersion:CAPITAL_VERSION,round:0,ended:false,history:[],allocations:{},confirmedRounds:{},capitals:{...BASE_CAPITALS},capitalHistory:[],investmentHistory:[],investmentUsed:{},actionUses:{},actionHistory:[],actionHands:{}};saveLocalState();route()}
  }
  else if(e.target.closest('#vote')){
    const used=Object.values(vals).reduce((a,b)=>a+b,0);
    const sync=window.fondosSync,round=Math.min(sync.state?.round??drawn.length,10);
    if(used===BUDGET_UNITS&&round>0&&!sync.state?.ended&&!sync.state?.confirmedRounds?.[round]){
      const allocation=Object.fromEntries(P.map(p=>[p.id,vals[p.id]*BUDGET_STEP]));
      const confirm=raw=>{const current=migrateState(raw||{});if(current.confirmedRounds?.[round])return current;const capitals={...BASE_CAPITALS,...(current.capitals||{})},stats={...current.stats},capitalHistory=[...(current.capitalHistory||[])];P.forEach(p=>{const amount=allocation[p.id]||0;capitals[p.id]+=amount;stats[p.id]={...stats[p.id],Economía:Math.floor(capitals[p.id]/ECONOMY_POINT_VALUE)};stats[p.id].Necesidad=deriveNeed(stats[p.id]);if(amount)capitalHistory.push({province:p.id,round,amount,at:Date.now(),kind:'reparto'})});return {...current,stats,capitals,capitalHistory,allocations:{...(current.allocations||{}),[round]:allocation},confirmedRounds:{...(current.confirmedRounds||{}),[round]:true}}};
      if(sync.ready&&sync.update)sync.update(confirm).then(state=>{sync.state=state;voteHTML=`<b class="ok">Dinero repartido y capitales actualizados en la ronda ${round}.</b>`;saveLocalState();route()}).catch(error=>{sync.status='No se pudo repartir el dinero: '+error.message;route()});
      else{sync.state=confirm(sync.state||{});voteHTML=`<b class="ok">Dinero repartido y capitales actualizados en la ronda ${round}.</b>`;saveLocalState();route()}
    }}
  else{const b=e.target.closest('.slot.on');if(b)openCard(+b.dataset.i)}
});
$('#page').addEventListener('input',e=>{if(e.target.dataset.id){const id=e.target.dataset.id,others=Object.entries(vals).reduce((sum,[key,n])=>sum+(key===id?0:n),0);vals[id]=Math.min(+e.target.value,BUDGET_UNITS-others);voteHTML='';$('#result').innerHTML='Distribuí los US$ 100.000. Los controles avanzan de US$ 2.500 en US$ 2.500.';upd()}});
$('#close').onclick=closeCard;
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeCard()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCard()});
window.addEventListener('hashchange',route);
window.addEventListener('fondos-sync',()=>{const s=window.fondosSync;if(!s.ready)return;drawn=s.state?.drawn||[];const activeRound=Math.min(s.state?.round??s.state?.drawn?.length??0,10),needsRepair=s.state&&(s.state.capitalVersion!==CAPITAL_VERSION||s.state.needVersion!==NEED_VERSION||(activeRound>0&&!s.state.actionHands?.[activeRound]));if(needsRepair&&s.update){s.update(ensureCurrentActionHands).then(state=>{s.state=state;P.forEach((p,i)=>p.s={...(state.stats?.[p.id]||BASE[i])});saveLocalState();route()}).catch(error=>{s.status='No se pudo actualizar el estado compartido: '+error.message;route()});return}if(s.state){s.state=ensureCurrentActionHands(s.state);P.forEach((p,i)=>p.s={...(s.state.stats?.[p.id]||BASE[i])});saveLocalState()}route()});
window.fondosReady?.then(()=>{const s=window.fondosSync;if(s.ready){drawn=s.state?.drawn||[];P.forEach((p,i)=>p.s={...(s.state?.stats?.[p.id]||BASE[i])});route()}});
route();
